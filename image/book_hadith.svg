<svg xmlns="http://www.w3.org/2000/svg" width="160" height="220" viewBox="0 0 160 220">
  <defs>
    <linearGradient id="bghadith" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c1a0e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0a1008;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="sphadith" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#050a04;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2c1a0e;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- spine -->
  <rect x="0" y="0" width="18" height="220" rx="3" fill="url(#sphadith)"/>
  <!-- cover -->
  <rect x="16" y="0" width="144" height="220" rx="0 4 4 0" fill="url(#bghadith)"/>
  <!-- border -->
  <rect x="20" y="6" width="136" height="208" rx="2" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.5"/>
  <rect x="24" y="10" width="128" height="200" rx="2" fill="none" stroke="#c9a84c" stroke-width="0.4" opacity="0.3"/>
  <!-- top ornament -->
  <text x="88" y="45" text-anchor="middle" font-family="serif" font-size="22" fill="#c9a84c" opacity="0.8">✦ ✦ ✦</text>
  <!-- title -->
  <text x="88" y="90" text-anchor="middle" font-family="serif" font-size="18" fill="#c9a84c" font-weight="bold">الحديث</text>
  <line x1="35" y1="100" x2="141" y2="100" stroke="#c9a84c" stroke-width="0.6" opacity="0.5"/>
  <!-- subtitle -->
  <text x="88" y="122" text-anchor="middle" font-family="serif" font-size="9" fill="#d4c4a0" opacity="0.8">نهج اليقين</text>
  <text x="88" y="136" text-anchor="middle" font-family="serif" font-size="7.5" fill="#b0a080" opacity="0.7">في شرح مناهج المؤلفين</text>
  <line x1="35" y1="146" x2="141" y2="146" stroke="#c9a84c" stroke-width="0.6" opacity="0.5"/>
  <!-- bottom -->
  <text x="88" y="178" text-anchor="middle" font-family="serif" font-size="8" fill="#a09070" opacity="0.7">ماستر الشريعة والابتكار الرقمي</text>
  <text x="88" y="192" text-anchor="middle" font-family="serif" font-size="7.5" fill="#8a7860" opacity="0.6">فوج 2025 – 2027</text>
  <text x="88" y="210" text-anchor="middle" font-family="serif" font-size="8" fill="#c9a84c" opacity="0.5">✦ ◆ ✦</text>
  <!-- shadow effect -->
  <rect x="16" y="0" width="8" height="220" fill="rgba(0,0,0,0.25)"/>
</svg>